  create-pr:
    name: Create Pull Request to prod
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.ACTIONS_DEPLOY_TOKEN }}
          branch: prod
          commit-message: 'Automated merge from main to prod'
          title: 'Merge main into prod'
          body: 'This PR merges the latest changes from main into prod.'
