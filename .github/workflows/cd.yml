name: Deploy to Production

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create SSH key file
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key

      - name: Create known_hosts file
        run: |
          ssh-keyscan -p 22 ${{ secrets.DEPLOY_HOST }} > known_hosts

      - name: Deploy via SSH
        run: |
          set -e
          ssh -i private_key \
              -o UserKnownHostsFile=known_hosts \
              -o IdentitiesOnly=yes \
              ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'

          set -e
          echo "------ Entering IdyieWeb directory ------"
          cd /root/IdyieOrg/IdyieWeb

          echo "------ Pulling latest code ------"
          git pull origin prod

          echo "------ Displaying Docker logs before update ------"
          docker compose logs --tail 50 || true

          echo "------ Restarting Docker containers ------"
          docker compose down
          docker compose up -d

          echo "------ Deployment complete ------"
          EOF

      - name: Cleanup SSH files
        run: rm -f private_key known_hosts
